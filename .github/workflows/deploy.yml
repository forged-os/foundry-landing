name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and inject variables
        env:
          DISCORD_INVITE: ${{ vars.DISCORD_INVITE }}
          FORGED_OS_URL: ${{ vars.FORGED_OS_URL }}
        run: |
          if [[ ! "$DISCORD_INVITE" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Error: DISCORD_INVITE is unset or contains invalid characters" >&2
            exit 1
          fi
          if [[ -z "$FORGED_OS_URL" ]]; then
            echo "Error: FORGED_OS_URL is unset" >&2
            exit 1
          fi
          # index.html is a single self-contained file (inline CSS, CDN fonts, no local assets).
          rm -rf _site && mkdir _site
          python3 scripts/inject.py "$DISCORD_INVITE" "$FORGED_OS_URL"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
